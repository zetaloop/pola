name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $tag = "v$version"
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked

      - name: Build
        run: cargo build --locked --release

      - name: Package
        shell: pwsh
        run: |
          $archive = 'target/release/pola-windows-x86_64.zip'
          Compress-Archive -Path target/release/pola.exe -DestinationPath $archive
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$archive.sha256", $hash)

      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create $env:TAG target/release/pola-windows-x86_64.zip target/release/pola-windows-x86_64.zip.sha256 --draft --target $env:GITHUB_SHA --title $env:TAG --generate-notes
