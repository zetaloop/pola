[package]
name = "pola"
version = "0.1.0"
edition = "2024"
description = "Windows light and dark appearance automation"
license = "MIT"
repository = "https://github.com/zetaloop/pola"
build = "build.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
