[package]
name = "pola"
version = "0.1.0"
edition = "2024"
description = "Native light and dark appearance automation"
license = "MIT"
repository = "https://github.com/zetaloop/pola"

[dependencies]
global-hotkey = "0.8.0"
interprocess = "2.4.4"
jiff = { version = "0.2.37", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
toml = "1.1.6"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSAppearance", "NSButton", "NSMenu", "NSScreen", "NSScrollView", "NSStatusBar", "NSTextField", "NSView", "NSWindow", "NSWorkspace", "NSCell", "NSControl", "NSMenuItem", "NSPanel", "NSResponder", "NSStatusItem", "AppKitDefines", "NSClipView", "NSGraphics", "NSRunningApplication", "NSStatusBarButton", "objc2-core-foundation", "NSStackView", "NSLayoutAnchor", "NSLayoutConstraint", "NSUserInterfaceLayout", "NSImage", "NSImageView", "NSFont", "NSColor", "NSToolbar", "NSToolbarItem", "NSSegmentedControl", "NSSegmentedCell", "NSSwitch", "NSDragging", "NSPasteboard", "NSPasteboardItem", "block2", "NSDatePicker", "NSDatePickerCell", "NSEvent", "NSViewController", "NSSplitView", "NSSplitViewController", "NSSplitViewItem", "NSTableView", "NSTableColumn", "NSLayoutGuide", "NSUserInterfaceItemIdentification", "NSButtonCell", "NSTextFieldCell", "NSTableHeaderView", "NSTableCellView", "NSTabViewController", "NSTabView", "NSTabViewItem", "NSGridView", "NSFontDescriptor", "NSTintProminence", "NSPopUpButton", "NSViewLayoutRegion", "NSText", "NSOpenPanel", "NSSavePanel", "NSAttributedString", "NSAccessibilityProtocols"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSAppleScript", "NSArray", "NSDictionary", "NSKeyValueObserving", "NSNotification", "NSTimer", "NSURL", "NSString", "NSObject", "NSEnumerator", "NSTimeZone", "NSData", "NSDate", "NSPropertyList", "NSValue", "NSLocale", "NSDateFormatter", "NSBundle", "NSUserDefaults", "NSAttributedString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Com", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62.2"
windows-pickers = { git = "https://github.com/microsoft/windows-rs.git", version = "0.100.0", features = ["reactor"] }
windows-reactor = { git = "https://github.com/microsoft/windows-rs.git", version = "0.100.0" }
windows-registry = { git = "https://github.com/microsoft/windows-rs.git", version = "0.100.0" }
windows-window = { git = "https://github.com/microsoft/windows-rs.git", version = "0.100.0" }

[target.'cfg(target_os = "windows")'.build-dependencies]
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs.git", version = "0.100.0" }
winresource = { version = "0.1.31", default-features = false }

[profile.release]
panic = "abort"

[profile.MacOS]
inherits = "release"

[build-dependencies]
toml = "1.1.6"
windows-bindgen = "0.100.0"
