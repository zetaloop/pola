[package]
name = "pola"
version = "0.1.0"
edition = "2024"
description = "Native light and dark appearance automation"
license = "MIT"
repository = "https://github.com/zetaloop/pola"

[dependencies]
global-hotkey = "0.8.0"
jiff = { version = "0.2.37", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSAppearance", "NSButton", "NSMenu", "NSOpenPanel", "NSPopUpButton", "NSScreen", "NSScrollView", "NSStatusBar", "NSTabView", "NSTextField", "NSView", "NSWindow", "NSWorkspace", "NSCell", "NSControl", "NSMenuItem", "NSPanel", "NSResponder", "NSSavePanel", "NSStatusItem", "NSTabViewItem", "AppKitDefines", "NSClipView", "NSGraphics", "NSRunningApplication", "NSStatusBarButton", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSAppleScript", "NSArray", "NSDictionary", "NSDistributedNotificationCenter", "NSNotification", "NSTimer", "NSURL", "NSString", "NSObject", "NSEnumerator", "NSTimeZone"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["objc2", "objc2-foundation", "SMAppService"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-notifyicon = { git = "https://github.com/microsoft/windows-rs.git", version = "0.100.0" }
windows-pickers = { git = "https://github.com/microsoft/windows-rs.git", version = "0.100.0", default-features = false, features = ["reactor"] }
windows-reactor = { git = "https://github.com/microsoft/windows-rs.git", version = "0.100.0" }
windows-registry = { git = "https://github.com/microsoft/windows-rs.git", version = "0.100.0" }
windows-window = { git = "https://github.com/microsoft/windows-rs.git", version = "0.100.0" }

[build-dependencies]
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs.git", version = "0.100.0" }
winresource = "0.1.31"
